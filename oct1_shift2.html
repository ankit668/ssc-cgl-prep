    <style>

            display: inline-block;

            display: flex;

        }

        .q-topic {

        }

        .q-text-en {

        /* Options Grid */

        @media (min-width: 600px) {

        .opt-btn {
            text-align: left;

        .opt-btn.wrong {

        .box-title.blue {

        .box-title.amber {
            color: var(--accent-amber);

        .hidden {

        /* Sticky Controls */
        .fab-bar {

            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .fab-btn {
            background: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fab-btn.primary {
            background: #2563EB;
            color: white;
            border-color: #2563EB;
        }
    </style>

    <script>
        const QUESTIONS = [{"id": 1, "topic": "Number System", "q_en": "How many multiples of 6 lie between 50 and 200?", "q_hi": "50 और 200 के बीच 6 के कितने गुणज होंगे?", "options": ["23", "24", "25", "26"], "correct": 2, "solution": "First multiple of 6 after 50 is 54 (6 × 9).<br>Last multiple of 6 before 200 is 198 (6 × 33).<br>Number of multiples = [(198 − 54) / 6] + 1 = (144 / 6) + 1 = 24 + 1 = <b>25</b>.", "shortcut": "⚡ <b>Division Trick:</b> ⌊200 / 6⌋ − ⌊50 / 6⌋ = 33 − 8 = <b>25</b> (Done in 2 seconds!).", "diagram": ""}, {"id": 2, "topic": "Average Speed", "q_en": "A person travels equal distances at 20, 30 and 60 km/h. What is the average speed?", "q_hi": "एक व्यक्ति समान दूरियां 20, 30 और 60 km/h की चाल से तय करता है। औसत चाल कितनी है?", "options": ["36 km/h", "33.3 km/h", "28 km/h", "30 km/h"], "correct": 3, "solution": "Let each equal distance = 60 km (LCM of 20, 30, 60).<br>Total Distance = 3 × 60 = 180 km.<br>Total Time = 60/20 + 60/30 + 60/60 = 3 + 2 + 1 = 6 hours.<br>Average Speed = 180 / 6 = <b>30 km/h</b>.", "shortcut": "⚡ <b>Harmonic Average:</b> 3 / (1/20 + 1/30 + 1/60) = 3 / (6/60) = 3 × 10 = <b>30 km/h</b>.", "diagram": ""}, {"id": 3, "topic": "Geometry", "q_en": "In a triangle, the centroid divides each median in what ratio, measured from the vertex?", "q_hi": "एक त्रिभुज में, केन्द्रक (centroid) प्रत्येक माध्यिका को शीर्ष से किस अनुपात में विभाजित करता है?", "options": ["2 : 1", "1 : 2", "3 : 1", "1 : 1"], "correct": 0, "solution": "In any triangle, the medians concur at the centroid (G). The centroid divides each median in the ratio <b>2 : 1</b> measured from the vertex to the midpoint of the opposite side (AG : GD = 2 : 1).", "shortcut": "⚡ <b>Standard Property:</b> Centroid ratio from vertex is always <b>2 : 1</b>.", "diagram": "<svg width=\"180\" height=\"130\" viewBox=\"0 0 180 130\" style=\"margin:8px auto; display:block;\">\n      <polygon points=\"90,15 25,115 155,115\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <line x1=\"90\" y1=\"15\" x2=\"90\" y2=\"115\" stroke=\"#F59E0B\" stroke-dasharray=\"3,3\" stroke-width=\"2\"/>\n      <circle cx=\"90\" cy=\"81\" r=\"4\" fill=\"#F43F5E\"/>\n      <text x=\"90\" y=\"12\" fill=\"#E2E8F0\" font-size=\"11\" text-anchor=\"middle\">A</text>\n      <text x=\"18\" y=\"122\" fill=\"#E2E8F0\" font-size=\"11\">B</text>\n      <text x=\"160\" y=\"122\" fill=\"#E2E8F0\" font-size=\"11\">C</text>\n      <text x=\"90\" y=\"127\" fill=\"#E2E8F0\" font-size=\"11\" text-anchor=\"middle\">D</text>\n      <text x=\"97\" y=\"80\" fill=\"#F43F5E\" font-size=\"11\" font-weight=\"bold\">G (2:1)</text>\n    </svg>"}, {"id": 4, "topic": "Algebra", "q_en": "Simplify: 5√3 − 2√3, given √3 = 1.732.", "q_hi": "सरल कीजिए: 5√3 − 2√3, दिया है √3 = 1.732.", "options": ["3.464", "5.196", "6.928", "1.732"], "correct": 1, "solution": "5√3 − 2√3 = (5 − 2)√3 = 3√3.<br>Given √3 = 1.732 ⟹ 3 × 1.732 = <b>5.196</b>.", "shortcut": "⚡ 3 × 1.732 = <b>5.196</b>.", "diagram": ""}, {"id": 5, "topic": "Profit & Loss", "q_en": "A person buys 6 articles for ₹x and sells 5 articles for ₹x. Find the profit percentage.", "q_hi": "एक व्यक्ति 6 वस्तुएं ₹x में खरीदता है और 5 वस्तुएं ₹x में बेचता है। लाभ प्रतिशत ज्ञात कीजिए।", "options": ["16.66%", "25%", "20%", "10%"], "correct": 2, "solution": "Cost price of 1 article = ₹x/6.<br>Selling price of 1 article = ₹x/5.<br>Profit % = [(x/5 − x/6) / (x/6)] × 100 = [(1/30) / (1/6)] × 100 = (1/5) × 100 = <b>20%</b>.", "shortcut": "⚡ <b>Article Rule:</b> [(Bought − Sold) / Sold] × 100 = [(6 − 5) / 5] × 100 = 1/5 = <b>20%</b>.", "diagram": ""}, {"id": 6, "topic": "Geometry", "q_en": "A chord of a circle has radius 10 cm and its distance from the centre is 6 cm. Find the length of the chord.", "q_hi": "एक वृत्त की त्रिज्या 10 cm है और केन्द्र से जीवा की दूरी 6 cm है। जीवा की लंबाई ज्ञात कीजिए।", "options": ["12 cm", "16 cm", "18 cm", "8 cm"], "correct": 1, "solution": "Perpendicular from centre bisects the chord.<br>Half-chord = √(Radius² − Distance²) = √(10² − 6²) = √(100 − 36) = √64 = 8 cm.<br>Length of chord = 2 × 8 = <b>16 cm</b>.", "shortcut": "⚡ <b>Triplet (6, 8, 10):</b> Half-chord is 8 cm ⟹ Total chord = 2 × 8 = <b>16 cm</b>.", "diagram": "<svg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"margin:8px auto; display:block;\">\n      <circle cx=\"75\" cy=\"75\" r=\"60\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <circle cx=\"75\" cy=\"75\" r=\"3\" fill=\"#E2E8F0\"/>\n      <line x1=\"27\" y1=\"111\" x2=\"123\" y2=\"111\" stroke=\"#F59E0B\" stroke-width=\"2.5\"/>\n      <line x1=\"75\" y1=\"75\" x2=\"75\" y2=\"111\" stroke=\"#F43F5E\" stroke-width=\"2\"/>\n      <line x1=\"75\" y1=\"75\" x2=\"123\" y2=\"111\" stroke=\"#10B981\" stroke-dasharray=\"3,3\" stroke-width=\"1.5\"/>\n      <text x=\"80\" y=\"96\" fill=\"#F43F5E\" font-size=\"11\">6</text>\n      <text x=\"105\" y=\"88\" fill=\"#10B981\" font-size=\"11\">10</text>\n      <text x=\"75\" y=\"126\" fill=\"#F59E0B\" font-size=\"11\" text-anchor=\"middle\">Chord = 16 cm</text>\n    </svg>"}, {"id": 7, "topic": "Trigonometry", "q_en": "If tan θ = √3, find sec²θ + cosec²θ.", "q_hi": "यदि tan θ = √3 है, तो sec²θ + cosec²θ का मान ज्ञात कीजिए।", "options": ["12/3", "14/3", "16/3", "10/3"], "correct": 2, "solution": "tan θ = √3 ⟹ θ = 60°.<br>sec 60° = 2 ⟹ sec²60° = 4.<br>cosec 60° = 2/√3 ⟹ cosec²60° = 4/3.<br>Value = 4 + 4/3 = <b>16/3 (5 1/3)</b>.", "shortcut": "⚡ <b>Product Rule:</b> sec²θ + cosec²θ = sec²θ · cosec²θ = 4 × (4/3) = <b>16/3</b>.", "diagram": "<svg width=\"140\" height=\"110\" viewBox=\"0 0 140 110\" style=\"margin:8px auto; display:block;\">\n      <polygon points=\"30,95 110,95 110,15\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <text x=\"70\" y=\"108\" fill=\"#E2E8F0\" font-size=\"11\" text-anchor=\"middle\">Base = 1</text>\n      <text x=\"122\" y=\"60\" fill=\"#E2E8F0\" font-size=\"11\">√3</text>\n      <text x=\"60\" y=\"50\" fill=\"#F59E0B\" font-size=\"11\">Hyp = 2</text>\n      <text x=\"45\" y=\"90\" fill=\"#38BDF8\" font-size=\"10\">60°</text>\n    </svg>"}, {"id": 8, "topic": "Time & Work", "q_en": "A can complete a work in 15 days and B in 20 days. If they work on alternate days (A starting), in how many days will the work be completed?", "q_hi": "A किसी काम को 15 दिन में और B उसे 20 दिन में पूरा कर सकता है। यदि वे बारी-बारी से काम करें (A पहले करे), तो काम कितने दिनों में पूरा होगा?", "options": ["16 days", "16.5 days", "18 days", "17 days"], "correct": 3, "solution": "Total work = LCM(15, 20) = 60 units.<br>Efficiencies: A = 4 units/day, B = 3 units/day.<br>In 2 days (1 cycle of A+B) = 4 + 3 = 7 units.<br>In 8 cycles (16 days) = 8 × 7 = 56 units.<br>Work remaining = 60 − 56 = 4 units.<br>On Day 17, A does exactly 4 units and completes the job.<br>Total days = 16 + 1 = <b>17 days</b>.", "shortcut": "⚡ <b>Cycle Trick:</b> 16 days = 56 units. Remainder 4 units is done by A in 1 full day ⟹ 16 + 1 = <b>17 days</b>.", "diagram": ""}, {"id": 9, "topic": "Mensuration 3D", "q_en": "A hollow hemisphere has outer radius R and inner radius r. If outer, inner and rim are painted, find the total painted surface area.", "q_hi": "एक खोखले अर्धगोले की बाहरी त्रिज्या R और आंतरिक त्रिज्या r है। यदि बाहरी सतह, आंतरिक सतह और किनारी (rim) को रंगा जाए, तो कुल रंगे क्षेत्र का क्षेत्रफल ज्ञात कीजिए।", "options": ["π(2R² + r²)", "3π(R² + r²)", "π(3R² + r²)", "2π(R² + r²)"], "correct": 2, "solution": "Outer Curved Surface Area = 2πR².<br>Inner Curved Surface Area = 2πr².<br>Area of circular rim = πR² − πr².<br>Total Area = 2πR² + 2πr² + (πR² − πr²) = 3πR² + πr² = <b>π(3R² + r²)</b>.", "shortcut": "⚡ <b>Formula:</b> Outer CSA (2) + Inner CSA (2) + Rim (R²−r²) = <b>π(3R² + r²)</b>.", "diagram": "<svg width=\"150\" height=\"95\" viewBox=\"0 0 150 95\" style=\"margin:8px auto; display:block;\">\n      <path d=\"M 15 40 A 60 45 0 0 0 135 40 Z\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <ellipse cx=\"75\" cy=\"40\" rx=\"60\" ry=\"14\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"75\" cy=\"40\" rx=\"42\" ry=\"9\" fill=\"rgba(245,158,11,0.2)\" stroke=\"#F59E0B\" stroke-width=\"1.5\"/>\n      <text x=\"75\" y=\"80\" fill=\"#38BDF8\" font-size=\"11\" text-anchor=\"middle\">Total = π(3R² + r²)</text>\n    </svg>"}, {"id": 10, "topic": "Geometry", "q_en": "Two equal chords are drawn on opposite sides of the centre of a circle. What can be said about their distances from the centre?", "q_hi": "एक वृत्त में केन्द्र के विपरीत ओर दो समान लंबाई की दो जीवा खींची जाती हैं। केन्द्र से उनकी दूरी के बारे में क्या कहा जा सकता है?", "options": ["They are equal (d₁ = d₂)", "d₁ > d₂", "d₁ < d₂", "Cannot be determined"], "correct": 0, "solution": "Theorem: Equal chords of a circle are equidistant from the centre. Therefore, their perpendicular distances are equal: <b>d₁ = d₂</b>.", "shortcut": "⚡ <b>Core Theorem:</b> Equal chords ⟹ Equal distances (<b>d₁ = d₂</b>).", "diagram": "<svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" style=\"margin:8px auto; display:block;\">\n      <circle cx=\"70\" cy=\"70\" r=\"55\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <line x1=\"25\" y1=\"35\" x2=\"115\" y2=\"35\" stroke=\"#F59E0B\" stroke-width=\"2\"/>\n      <line x1=\"25\" y1=\"105\" x2=\"115\" y2=\"105\" stroke=\"#F59E0B\" stroke-width=\"2\"/>\n      <circle cx=\"70\" cy=\"70\" r=\"3\" fill=\"#E2E8F0\"/>\n      <line x1=\"70\" y1=\"70\" x2=\"70\" y2=\"35\" stroke=\"#F43F5E\" stroke-dasharray=\"2,2\"/>\n      <line x1=\"70\" y1=\"70\" x2=\"70\" y2=\"105\" stroke=\"#F43F5E\" stroke-dasharray=\"2,2\"/>\n      <text x=\"75\" y=\"55\" fill=\"#F43F5E\" font-size=\"10\">d₁</text>\n      <text x=\"75\" y=\"93\" fill=\"#F43F5E\" font-size=\"10\">d₂</text>\n    </svg>"}, {"id": 11, "topic": "Trigonometry", "q_en": "If tan x = √3, find (sec²x + cosec²x) ÷ (sec²x − cosec²x).", "q_hi": "यदि tan x = √3 है, तो (sec²x + cosec²x) ÷ (sec²x − cosec²x) का मान ज्ञात कीजिए।", "options": ["1", "2", "3", "4"], "correct": 1, "solution": "x = 60° ⟹ sec²60° = 4, cosec²60° = 4/3.<br>Numerator = 4 + 4/3 = 16/3.<br>Denominator = 4 − 4/3 = 8/3.<br>Value = (16/3) / (8/3) = 16 / 8 = <b>2</b>.", "shortcut": "⚡ <b>Divide by cosec²x:</b> (tan²x + 1)/(tan²x − 1) = (3 + 1)/(3 − 1) = 4/2 = <b>2</b>.", "diagram": ""}, {"id": 12, "topic": "Mensuration 2D", "q_en": "Find the area of a sector of a circle of radius 14 cm and central angle 60°.", "q_hi": "14 cm त्रिज्या वाले वृत्त के एक सेक्टर (sector) का क्षेत्रफल ज्ञात कीजिए जिसकी केन्द्रीय कोण 60° है।", "options": ["100 cm²", "308/3 cm² (102.67 cm²)", "154 cm²", "616/3 cm²"], "correct": 1, "solution": "Area of sector = (θ / 360°) × πr².<br>Area = (60° / 360°) × (22/7) × 14 × 14 = (1/6) × (22 × 2 × 14) = (1/6) × 616 = <b>308/3 cm² (≈ 102.67 cm²)</b>.", "shortcut": "⚡ Circle area for r=14 is 616 cm². 60° is 1/6th of a circle ⟹ 616 / 6 = <b>308/3 cm²</b>.", "diagram": "<svg width=\"140\" height=\"120\" viewBox=\"0 0 140 120\" style=\"margin:8px auto; display:block;\">\n      <path d=\"M 20 100 L 110 100 A 90 90 0 0 0 65 22 Z\" fill=\"rgba(56,189,248,0.15)\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <text x=\"40\" y=\"92\" fill=\"#F59E0B\" font-size=\"11\">60°</text>\n      <text x=\"65\" y=\"112\" fill=\"#E2E8F0\" font-size=\"11\">r = 14 cm</text>\n    </svg>"}, {"id": 13, "topic": "Heights & Distances", "q_en": "Two observers stand on opposite sides of a tower of height 20 m. The angles of elevation of the top are 30° and 60°. Find the distance between the observers.", "q_hi": "20 m ऊंचे टॉवर के शीर्ष के कोण 30° और 60° हैं। निरीक्षकों के बीच की दूरी ज्ञात कीजिए।", "options": ["40 m", "80√3/3 m (≈ 46.19 m)", "34.64 m", "52.3 m"], "correct": 1, "solution": "Let distance of observer 1 be x: tan 30° = 20/x ⟹ x = 20√3 m.<br>Let distance of observer 2 be y: tan 60° = 20/y ⟹ y = 20/√3 m.<br>Total distance = x + y = 20√3 + 20/√3 = (60 + 20)/√3 = 80/√3 = <b>80√3/3 m (≈ 46.19 m)</b>.", "shortcut": "⚡ <b>Formula for opposite sides:</b> d = h(√3 + 1/√3) = 20 × (4/√3) = 80/√3 = <b>46.19 m</b>.", "diagram": "<svg width=\"180\" height=\"110\" viewBox=\"0 0 180 110\" style=\"margin:8px auto; display:block;\">\n      <line x1=\"20\" y1=\"95\" x2=\"160\" y2=\"95\" stroke=\"#E2E8F0\" stroke-width=\"2\"/>\n      <line x1=\"90\" y1=\"95\" x2=\"90\" y2=\"20\" stroke=\"#F59E0B\" stroke-width=\"3\"/>\n      <line x1=\"20\" y1=\"95\" x2=\"90\" y2=\"20\" stroke=\"#38BDF8\" stroke-width=\"1.5\"/>\n      <line x1=\"160\" y1=\"95\" x2=\"90\" y2=\"20\" stroke=\"#38BDF8\" stroke-width=\"1.5\"/>\n      <text x=\"95\" y=\"55\" fill=\"#F59E0B\" font-size=\"11\">20m</text>\n      <text x=\"35\" y=\"90\" fill=\"#38BDF8\" font-size=\"10\">30°</text>\n      <text x=\"135\" y=\"90\" fill=\"#38BDF8\" font-size=\"10\">60°</text>\n      <text x=\"50\" y=\"107\" fill=\"#94A3B8\" font-size=\"10\">x</text>\n      <text x=\"125\" y=\"107\" fill=\"#94A3B8\" font-size=\"10\">y</text>\n    </svg>"}, {"id": 14, "topic": "Algebra", "q_en": "Which of the following is the correct factorisation of a² − b²?", "q_hi": "निम्न में से a² − b² का सही गुणनखण्ड कौन-सा है?", "options": ["(a − b)²", "(a + b)²", "(a − b)(a + b)", "a² + b² − 2ab"], "correct": 2, "solution": "Standard algebraic identity: a² − b² = <b>(a − b)(a + b)</b>.", "shortcut": "⚡ Universal formula: <b>(a − b)(a + b)</b>.", "diagram": ""}, {"id": 15, "topic": "Geometry", "q_en": "A circle has radius 9 cm and the distance of an external point from its centre is 15 cm. Find the length of the tangent from the point.", "q_hi": "एक वृत्त की त्रिज्या 9 cm है और केन्द्र से बाहरी बिंदु की दूरी 15 cm है। उस बिंदु से खींची गई स्पर्श रेखा की लंबाई ज्ञात कीजिए।", "options": ["10 cm", "12 cm", "14 cm", "8 cm"], "correct": 1, "solution": "Tangent is perpendicular to the radius at the point of contact.<br>Tangent length = √(Distance² − Radius²) = √(15² − 9²) = √(225 − 81) = √144 = <b>12 cm</b>.", "shortcut": "⚡ <b>Triplet (9, 12, 15):</b> Tangent = <b>12 cm</b> (Scaled 3, 4, 5 triplet).", "diagram": "<svg width=\"150\" height=\"120\" viewBox=\"0 0 150 120\" style=\"margin:8px auto; display:block;\">\n      <circle cx=\"50\" cy=\"60\" r=\"35\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\"/>\n      <circle cx=\"50\" cy=\"60\" r=\"2.5\" fill=\"#E2E8F0\"/>\n      <line x1=\"50\" y1=\"60\" x2=\"80\" y2=\"35\" stroke=\"#F43F5E\" stroke-width=\"1.5\"/>\n      <line x1=\"80\" y1=\"35\" x2=\"135\" y2=\"85\" stroke=\"#10B981\" stroke-width=\"2\"/>\n      <line x1=\"50\" y1=\"60\" x2=\"135\" y2=\"85\" stroke=\"#F59E0B\" stroke-dasharray=\"2,2\" stroke-width=\"1.5\"/>\n      <text x=\"56\" y=\"44\" fill=\"#F43F5E\" font-size=\"10\">9</text>\n      <text x=\"90\" y=\"85\" fill=\"#F59E0B\" font-size=\"10\">15</text>\n      <text x=\"110\" y=\"55\" fill=\"#10B981\" font-size=\"10\" font-weight=\"bold\">12 cm</text>\n    </svg>"}, {"id": 16, "topic": "Speed, Time & Distance", "q_en": "A vehicle increases its speed by x km/h and reaches t hours earlier than usual. If the original speed is 5 km/h, find the distance travelled.", "q_hi": "एक वाहन अपनी गति में x km/h बढ़ाता है और सामान्य से t घंटे पहले पहुंचता है। यदि मूल चाल 5 km/h है, तो तय की गई दूरी ज्ञात कीजिए।", "options": ["D = [5x / (5 + x)] × t", "D = [x / (5(5 + x))] × t", "D = [5(5 + x) / x] × t", "D = 5xt"], "correct": 2, "solution": "Original Speed S₁ = 5 km/h. New Speed S₂ = 5 + x km/h. Time difference = t hours.<br>Formula: Distance D = [S₁ × S₂ / (S₂ − S₁)] × Δt.<br>D = [5(5 + x) / ((5 + x) − 5)] × t = <b>[5(5 + x) / x] × t</b>.", "shortcut": "⚡ <b>Distance Formula:</b> (Product of speeds / Difference) × Δt = <b>5(5 + x)t / x</b>.", "diagram": ""}, {"id": 17, "topic": "Number System", "q_en": "Find the value of x if the number 7x35 is divisible by 11.", "q_hi": "यदि संख्या 7x35, 11 से विभाज्य है, तो x का मान ज्ञात कीजिए।", "options": ["5", "4", "6", "3"], "correct": 0, "solution": "Rule of 11: Difference of sum of digits at odd places and even places must be 0 or a multiple of 11.<br>Sum of odd places = 7 + 3 = 10.<br>Sum of even places = x + 5.<br>Difference = 10 − (x + 5) = 5 − x.<br>Set 5 − x = 0 ⟹ x = <b>5</b>.<br>(Verification: 7535 ÷ 11 = 685, perfectly divisible).", "shortcut": "⚡ (7 + 3) − (x + 5) = 0 ⟹ 10 − x − 5 = 0 ⟹ x = <b>5</b>.", "diagram": ""}];

        let showSolutions = false;
        let revealedQuestions = new Set();
        let userAttempts = {}; // qId -> selectedIndex
        let correctCount = 0;
        let totalAttempted = 0;

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            QUESTIONS.forEach(q => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `q-card-${q.id}`;

                const isRevealed = showSolutions || revealedQuestions.has(q.id);
                const userSelected = userAttempts[q.id];

                let diagramHtml = '';
                if (q.diagram) {
                    diagramHtml = `<div class="q-diagram">${q.diagram}</div>`;
                }

                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    let optClass = 'opt-btn';
                    if (isRevealed) {
                        if (idx === q.correct) optClass += ' correct';
                        else if (userSelected === idx) optClass += ' wrong';
                    } else if (userSelected !== undefined) {
                        if (idx === q.correct) optClass += ' correct';
                        else if (userSelected === idx) optClass += ' wrong';
                    }
                    optionsHtml += `<button class="${optClass}" onclick="handleOptionClick(${q.id}, ${idx})">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-num">Q${q.id} of 17</span>
                        <span class="q-topic">${q.topic}</span>
                    </div>
                    <div class="q-text-en">${q.q_en}</div>
                    <div class="q-text-hi">${q.q_hi}</div>
                    ${diagramHtml}
                    <div class="options-grid" id="opts-${q.id}">
                        ${optionsHtml}
                    </div>
                    <div class="solution-box ${isRevealed ? '' : 'hidden'}" id="sol-${q.id}">
                        <div class="box-title blue">📖 Step-by-Step Solution:</div>
                        <div>${q.solution}</div>
                    </div>
                    <div class="shortcut-box ${isRevealed ? '' : 'hidden'}" id="sc-${q.id}">
                        <div class="box-title amber">⚡ Exam Shortcut:</div>
                        <div>${q.shortcut}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function handleOptionClick(qId, selectedIdx) {
            const q = QUESTIONS.find(item => item.id === qId);
            if (!q) return;

            if (userAttempts[qId] === undefined) {
                userAttempts[qId] = selectedIdx;
                totalAttempted++;
                if (selectedIdx === q.correct) {
                    correctCount++;
                }
                document.getElementById('score-text').innerText = `Score: ${correctCount} / ${totalAttempted}`;
            }

            revealedQuestions.add(qId);

            const optContainer = document.getElementById(`opts-${qId}`);
            if (optContainer) {
                const buttons = optContainer.querySelectorAll('.opt-btn');
                buttons.forEach((btn, idx) => {
                    btn.classList.remove('correct', 'wrong');
                    if (idx === q.correct) {
                        btn.classList.add('correct');
                    } else if (idx === selectedIdx) {
                        btn.classList.add('wrong');
                    }
                });
            }

            const solEl = document.getElementById(`sol-${qId}`);
            const scEl = document.getElementById(`sc-${qId}`);
            if (solEl) solEl.classList.remove('hidden');
            if (scEl) scEl.classList.remove('hidden');

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function toggleAllSolutions() {
            showSolutions = !showSolutions;
            const btn = document.getElementById('toggle-solutions-btn');
            if (showSolutions) {
                btn.innerText = '🙈 Hide Solutions';
            } else {
                btn.innerText = '👀 Show Solutions';
                revealedQuestions.clear();
            }
            renderQuestions();
        }

        // Start in self test mode
        renderQuestions();
    </script>
